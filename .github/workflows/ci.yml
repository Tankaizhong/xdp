name: CI/CD

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libelf-dev iproute2 git pkg-config libpcap-dev

      - name: Build and install libbpf
        run: |
          cd lib/libbpf/src
          make
          sudo make install_headers PREFIX=/usr

      - name: Build and install xdp-tools
        run: |
          cd lib/xdp-tools
          ./configure
          make
          sudo make install PREFIX=/usr
          sudo ldconfig

      - name: Build
        run: make

      - name: Run tests
        run: |
          sudo ./test.sh all || true
