name: CI/CD

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libelf-dev iproute2 git pkg-config
          # Fix libxdp symlink if needed
          if [ -f /usr/lib/x86_64-linux-gnu/libxdp.so.1 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libxdp.so.1 /usr/lib/x86_64-linux-gnu/libxdp.so || true
            sudo ldconfig
          fi

      - name: Show versions
        run: |
          clang --version
          llvm-version
          echo "=== Current directory ==="
          pwd
          ls -la

      - name: Build
        run: make V=1

      - name: Run tests
        run: |
          sudo ./test.sh all || true
