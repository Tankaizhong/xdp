name: Docker Build

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: xdp-lb:latest
          load: true

      - name: Test container
        run: |
          docker run --rm xdp-lb:latest make clean && make
