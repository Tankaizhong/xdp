name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            zstd \
            binutils-dev \
            elfutils \
            libpcap-dev \
            libelf-dev \
            libbpf-dev \
            libxdp-dev \
            linux-tools-common \
            gcc-multilib \
            pkg-config \
            iproute2 \
            git \
            linux-libc-dev

      - name: Build
        run: make

      - name: Prepare test tools
        run: |
          ./.github/scripts/prepare_test_tools.sh || true

      - name: Run tests
        run: |
          ./.github/scripts/run-tests.sh
