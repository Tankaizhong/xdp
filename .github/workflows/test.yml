name: Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            zstd \
            binutils-dev \
            elfutils \
            libpcap-dev \
            libelf-dev \
            libbpf-dev \
            libxdp-dev \
            linux-tools-common \
            gcc-multilib \
            pkg-config \
            iproute2 \
            git \
            linux-libc-dev

      - name: Check dependencies
        run: ./configure

      - name: Build
        run: make

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."

          # Check if binaries exist
          if [ ! -f "xdp_user" ]; then
            echo "ERROR: xdp_user not found"
            exit 1
          fi

          if [ ! -f "af_xdp_user" ]; then
            echo "ERROR: af_xdp_user not found"
            exit 1
          fi

          if [ ! -f "xdp_kern.o" ]; then
            echo "ERROR: xdp_kern.o not found"
            exit 1
          fi

          echo "All binaries found!"

          # Check xdp_user is executable
          file xdp_user
          file af_xdp_user

          # Check xdp_kern.o is a valid ELF BPF object file
          file xdp_kern.o

          # Verify BPF program section exists
          if readelf -S xdp_kern.o | grep -q "xdp"; then
            echo "BPF program section found!"
          else
            echo "WARNING: xdp section not found"
          fi

          echo "Build verification passed!"
