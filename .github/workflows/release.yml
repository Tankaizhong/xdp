---
name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            libelf-dev \
            libpcap-dev \
            libbpf-dev \
            libxdp-dev \
            zstd \
            gcc-multilib \
            pkg-config

      - name: Build
        run: make

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            xdp_kern.o
            xdp_user
            af_xdp_user
