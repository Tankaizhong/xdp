# Travis CI configuration for XDP project
language: c

os:
  - linux

dist: focal

compiler:
  - gcc
  - clang

env:
  global:
    - MAKEFLAGS="-j$(nproc)"

before_install:
  - sudo apt-get update

install:
  - sudo apt-get install -y \
      build-essential \
      clang \
      llvm \
      libelf-dev \
      libpcap-dev \
      libbpf-dev \
      pkg-config \
      iproute2 \
      git

script:
  - make clean || true
  - make

# Run tests if available
# - ./test.sh || true

notifications:
  email:
    on_success: always
    on_failure: always
