apiVersion: v1
kind: ConfigMap
metadata:
  name: xdp-config
  namespace: xdp-lb
data:
  backend.conf: |
    192.168.89.101:8080
    192.168.89.102:8080
    192.168.89.103:8080
---
apiVersion: v1
kind: Service
metadata:
  name: xdp-lb
  namespace: xdp-lb
spec:
  type: NodePort
  selector:
    app: xdp-lb
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xdp-lb
  namespace: xdp-lb
spec:
  selector:
    matchLabels:
      app: xdp-lb
  template:
    metadata:
      labels:
        app: xdp-lb
    spec:
      hostNetwork: true
      securityContext:
        privileged: true
      containers:
      - name: xdp
        image: xdp-lb:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: INTERFACE
          value: "eth0"
        - name: BACKEND_INTERFACE
          value: "eth1"
        volumeMounts:
        - name: etc-cni
          mountPath: /etc/cni/net.d
        - name: sys-fs-bpf
          mountPath: /sys/fs/bpf
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
      volumes:
      - name: etc-cni
        hostPath:
          path: /etc/cni/net.d
      - name: sys-fs-bpf
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: lib-modules
        hostPath:
          path: /lib/modules
